<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Segmentación Presencia</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --border: #30363d;
      --text-primary: #e6edf3;
      --text-secondary: #7d8590;
      --accent: #58a6ff;
      --success: #3fb950;
      --warning: #d29922;
      --danger: #f85149;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
    }

    /* Login Screen */
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3rem;
      width: 100%;
      max-width: 400px;
    }

    .login-card h2 {
      margin-bottom: 2rem;
      text-align: center;
      color: var(--text-primary);
    }

    /* Dashboard Title */
    .dashboard-header {
      padding: 1.5rem 2rem;
      background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .dashboard-header h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin: 0;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .user-badge {
      background-color: var(--bg-tertiary);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.875rem;
    }

    /* Card Styling */
    .card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1.5rem;
      color: var(--text-primary);
    }

    .card-body {
      padding: 1.5rem;
    }

    /* Table Styling */
    .table {
      color: var(--text-primary);
      margin-bottom: 0;
    }

    .table thead th {
      background-color: var(--bg-tertiary);
      border-bottom: 2px solid var(--border);
      color: var(--text-secondary);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      padding: 1rem;
    }

    .table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background-color 0.2s ease;
    }

    .table tbody tr:hover {
      background-color: var(--bg-tertiary);
    }

    .table tbody td {
      padding: 1rem;
      vertical-align: middle;
    }

    /* Badges */
    .badge {
      padding: 0.375rem 0.75rem;
      font-weight: 500;
      border-radius: 6px;
      font-size: 0.75rem;
    }

    .badge.bg-success {
      background-color: var(--success) !important;
    }

    .badge.bg-danger {
      background-color: var(--danger) !important;
    }

    .badge.bg-warning {
      background-color: var(--warning) !important;
      color: var(--bg-primary) !important;
    }

    .badge.bg-secondary {
      background-color: var(--text-secondary) !important;
    }

    /* Buttons */
    .btn {
      border-radius: 6px;
      font-weight: 500;
      padding: 0.5rem 1rem;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: var(--accent);
      border-color: var(--accent);
      color: var(--bg-primary);
    }

    .btn-primary:hover {
      background-color: #4a8cd6;
      border-color: #4a8cd6;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(88, 166, 255, 0.3);
    }

    .btn-success {
      background-color: var(--success);
      border-color: var(--success);
    }

    .btn-danger {
      background-color: var(--danger);
      border-color: var(--danger);
    }

    .btn-outline-light {
      color: var(--text-primary);
      border-color: var(--border);
    }

    .btn-outline-light:hover {
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
    }

    /* Input Styling */
    .form-control, .form-select {
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-primary);
    }

    .form-control:focus, .form-select:focus {
      background-color: var(--bg-tertiary);
      border-color: var(--accent);
      color: var(--text-primary);
      box-shadow: 0 0 0 0.2rem rgba(88, 166, 255, 0.25);
    }

    .form-label {
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
    }

    .empty-state i {
      font-size: 4rem;
      color: var(--text-secondary);
      margin-bottom: 1rem;
    }

    .empty-state h3 {
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .empty-state p {
      color: var(--text-secondary);
    }

    /* Loading Spinner */
    .spinner-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 3rem;
    }

    .spinner-border {
      color: var(--accent);
    }

    /* Stats Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      transition: transform 0.2s ease;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .stat-card .stat-icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      opacity: 0.8;
    }

    .stat-card .stat-value {
      font-size: 2.5rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 0.25rem;
    }

    .stat-card .stat-label {
      color: var(--text-secondary);
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Hide/Show */
    .hidden {
      display: none !important;
    }

    /* Tarjetas de Máscaras */
    .mascara-card {
      background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
      height: 100%;
    }

    .mascara-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(88, 166, 255, 0.2);
    }

    .mascara-card .card-img-top {
      width: 100%;
      height: 250px;
      object-fit: cover;
      background-color: var(--bg-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border);
    }

    .mascara-card .card-img-placeholder {
      width: 100%;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-tertiary) 0%, var(--bg-secondary) 100%);
      border-bottom: 1px solid var(--border);
    }

    .mascara-card .card-img-placeholder i {
      font-size: 4rem;
      color: var(--text-secondary);
      opacity: 0.3;
    }

    .mascara-card .card-body {
      padding: 1.25rem;
    }

    .mascara-card .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--accent);
    }

    .mascara-card .card-text {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    .mascara-card .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    .mascara-card .info-row:last-child {
      border-bottom: none;
    }

    .mascara-card .info-label {
      font-weight: 500;
      color: var(--text-secondary);
      font-size: 0.875rem;
    }

    .mascara-card .info-value {
      font-weight: 600;
      color: var(--text-primary);
    }

    .mascara-card .card-footer {
      background-color: transparent;
      border-top: 1px solid var(--border);
      padding: 1rem 1.25rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .mascara-card .btn-action {
      flex: 1;
      min-width: 100px;
    }
  </style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen" class="login-container">
  <div class="login-card">
    <h2><i class="fas fa-masks-theater"></i> Segmentación Presencia</h2>
    <form id="loginForm">
      <div class="mb-3">
        <label for="username" class="form-label">Usuario</label>
        <input type="text" class="form-control" id="username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <div id="loginError" class="alert alert-danger hidden" role="alert"></div>
      <button type="submit" class="btn btn-primary w-100">
        <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
      </button>
    </form>
    <div class="mt-3 text-center">
      <small class="text-secondary">
        Usuario principal: Estegania/estegania2025
      </small>
    </div>
  </div>
</div>

<!-- Dashboard Screen -->
<div id="dashboardScreen" class="hidden">
  <!-- Header -->
  <div class="dashboard-header">
    <div>
      <h1><i class="fas fa-masks-theater"></i> Dashboard Segmentación Presencia</h1>
      <small class="text-secondary">Sistema de Gestión de Máscaras con Revisión</small>
    </div>
    <div class="user-info">
      <div class="user-badge">
        <i class="fas fa-user"></i>
        <span id="userDisplay"></span>
        <span class="badge bg-info ms-2" id="roleDisplay"></span>
      </div>
      <button id="logoutBtn" class="btn btn-outline-light btn-sm">
        <i class="fas fa-sign-out-alt"></i> Salir
      </button>
    </div>
  </div>

  <div class="container-fluid px-4">
    <!-- Estadísticas -->
    <div class="stats-grid" id="statsContainer">
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-mask"></i></div>
        <div class="stat-value" id="totalMascaras">0</div>
        <div class="stat-label">Total Máscaras</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
        <div class="stat-value" id="mascarasAprobadas">0</div>
        <div class="stat-label">Aprobadas</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-clock"></i></div>
        <div class="stat-value" id="mascarasPendientes">0</div>
        <div class="stat-label">Pendientes</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-robot"></i></div>
        <div class="stat-value" id="mascarasListasIA">0</div>
        <div class="stat-label">Listas para IA</div>
      </div>
    </div>

    <!-- Tabla de Máscaras -->
    <div class="card">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h5 class="mb-0"><i class="fas fa-table"></i> Máscaras</h5>
          <button id="addMascaraBtn" class="btn btn-primary">
            <i class="fas fa-plus"></i> Nueva Máscara
          </button>
        </div>

        <!-- Estado de carga -->
        <div id="loadingSpinner" class="spinner-container">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">Cargando...</span>
          </div>
        </div>

        <!-- Estado vacío -->
        <div id="emptyState" class="empty-state hidden">
          <i class="fas fa-inbox"></i>
          <h3>No hay máscaras disponibles</h3>
          <p>Agrega tu primera máscara para comenzar.</p>
        </div>

        <!-- Grid de tarjetas de máscaras -->
        <div id="cardsContainer" class="hidden">
          <div id="mascarasGrid" class="row g-4">
            <!-- Se llenará dinámicamente con JavaScript -->
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Dashboard JS -->
<script src="/static/js/dashboard.js"></script>

</body>
</html>
